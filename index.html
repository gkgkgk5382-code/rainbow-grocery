let selected='전체',cart=JSON.parse(localStorage.getItem('rainbowCart')||'{}'),orders=JSON.parse(localStorage.getItem('rainbowOrders')||'[]');const $=s=>document.querySelector(s),money=n=>'$'+n.toFixed(2);function save(){localStorage.setItem('rainbowCart',JSON.stringify(cart))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function drawCats(){$('#cats').innerHTML=['전체',...groups.map(g=>g[0])].map(c=>`<button class="cat ${selected===c?'active':''}" data-cat="${esc(c)}">${c==='전체'?'🛒 전체 상품':c}</button>`).join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{selected=b.dataset.cat;drawCats();render()})}function render(){let q=$('#search').value.trim().toLowerCase(),items=catalog.filter(p=>(selected==='전체'||p.cat===selected)&&(!q||(p.en+' '+p.ko+' '+p.cat).toLowerCase().includes(q)));let sort=$('#sort').value;if(sort==='low')items.sort((a,b)=>a.price-b.price);if(sort==='high')items.sort((a,b)=>b.price-a.price);if(sort==='az')items.sort((a,b)=>a.en.localeCompare(b.en));$('#heading').textContent=selected==='전체'?'모든 식료품':selected;$('#total').textContent=items.length+'개 상품';$('#products').innerHTML=items.length?items.map(p=>`<article class="product"><div class="photo"><img loading="lazy" src="https://images.unsplash.com/${photos[p.cat]}?auto=format&fit=crop&w=400&q=65" alt="${esc(p.en)} 식품 카테고리 참고 사진" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="fallback" style="display:none">${p.emoji}</span></div><div class="details"><small>${p.cat}</small><h3>${esc(p.en)}<br><span style="font-weight:400;color:#756c80">${esc(p.ko)}</span></h3><div class="price">${money(p.price)}</div><small>${p.unit}</small><button class="add" data-id="${p.id}">＋ 장바구니 담기</button></div></article>`).join(''):'<div class="empty">🔎 검색 결과가 없어요. 다른 식품을 찾아보세요!</div>';document.querySelectorAll('.add').forEach(b=>b.onclick=()=>{let k=b.dataset.id;cart[k]=(cart[k]||0)+1;save();renderCart();b.textContent='✓ 담았어요!';setTimeout(()=>b.textContent='＋ 장바구니 담기',700)})}function totals(){let sub=Object.entries(cart).reduce((s,[k,n])=>s+catalog[+k].price*n,0);let delivery=sub>=50||sub===0?0:5.99;let tax=0;return{sub,delivery,tax,total:sub+delivery+tax}}function renderCart(){let entries=Object.entries(cart).filter(([k,n])=>n>0),count=entries.reduce((s,[,n])=>s+n,0);$('#count').textContent=count;$('#cartItems').innerHTML=entries.length?entries.map(([k,n])=>{let p=catalog[+k];return `<div class="cartitem"><span class="emoji">${p.emoji}</span><div class="info"><b>${esc(p.en)}</b><br><small>${esc(p.ko)}</small><br><b>${money(p.price*n)}</b></div><div class="qty"><button data-k="${k}" data-d="-1">−</button>${n}<button data-k="${k}" data-d="1">＋</button></div></div>`}).join(''):'<div class="empty">🛒 장바구니가 비었어요!</div>';document.querySelectorAll('.qty button').forEach(b=>b.onclick=()=>{let k=b.dataset.k;cart[k]=(cart[k]||0)+Number(b.dataset.d);if(cart[k]<=0)delete cart[k];save();renderCart()});let t=totals();$('#summary').innerHTML=`<p>상품 금액 <b>${money(t.sub)}</b></p><p>배송비 <b>${t.delivery?money(t.delivery):'무료'}</b></p><p>세금 <b>${money(t.tax)} (가상 면세)</b></p><p style="font-size:20px">합계 <b>${money(t.total)}</b></p><small>💝 $50 이상 구매 시 무료 배송!</small><button class="primary" style="width:100%;margin-top:12px" id="checkoutBtn" ${!count?'disabled':''}>💳 가상 계산하기</button>`;$('#checkoutBtn').onclick=()=>{if(!count)return;$('#drawer').classList.remove('open');$('#checkout').classList.add('show')}}function showCart(){ $('#overlay').classList.add('show');$('#drawer').classList.add('open')}function closeAll(){$('#overlay').classList.remove('show');$('#drawer').classList.remove('open');$('#checkout').classList.remove('show')}$('#openCart').onclick=showCart;$('#closeCart').onclick=closeAll;$('#overlay').onclick=closeAll;$('#cancelCheckout').onclick=()=>{$('#checkout').classList.remove('show');$('#drawer').classList.add('open')};$('#search').oninput=render;$('#sort').onchange=render;function drawOrders(){$('#orders').innerHTML=orders.length?orders.slice(0,8).map(o=>`<article>🎉 <b>주문 #${o.id}</b> · ${esc(o.date)} · ${o.count}개 상품 · <b>${money(o.total)}</b><br><small>${esc(o.buyer)} · ${esc(o.payment)} · 가상 주문 완료</small></article>`).join(''):'<p>아직 주문이 없어요. 첫 장보기를 시작해보세요! 🥰</p>'}$('#orderForm').onsubmit=e=>{e.preventDefault();let t=totals();if(!Object.keys(cart).length)return;orders.unshift({id:Date.now().toString().slice(-8),date:new Date().toLocaleString('ko-KR'),count:Object.values(cart).reduce((a,b)=>a+b,0),total:t.total,buyer:$('#buyer').value,payment:$('#payment').value});localStorage.setItem('rainbowOrders',JSON.stringify(orders));cart={};save();closeAll();renderCart();drawOrders();$('#orderForm').reset();alert('🎉 가상 주문이 완료됐어요! 주문 내역에서 확인하세요. 실제 결제/배송은 없습니다.')};drawCats();render();renderCart();drawOrders();
